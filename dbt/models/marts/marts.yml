version: 2

models:
  - name: fct_hourly_commerce_metrics
    description: >-
      One row per finalized hourly window and currency, combining revenue,
      lifecycle counts, and status-event distribution for reporting.
    columns:
      - name: window_start
        data_tests:
          - not_null
      - name: window_end
        data_tests:
          - not_null
      - name: currency
        data_tests:
          - not_null
      - name: order_event_count
        data_tests:
          - not_null
      - name: revenue
        data_tests:
          - not_null
