[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-commerce-platform"
version = "0.1.0"
description = "A local real-time commerce event processing platform."
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka",
    "pydantic>=2",
    "pydantic-settings",
    "psycopg[binary]",
    "python-dotenv",
]

[project.optional-dependencies]
analytics = [
    "pyarrow>=18",
]
dbt = [
    "dbt-postgres>=1.10,<2",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = [
    "tests*",
    "infrastructure*",
    "scripts*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: tests requiring Docker infrastructure",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
